<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#05070d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Hyper-Cluster Omega</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app" class="app">

  <!-- ── the top bar ─────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span id="health-dot" class="dot dot-off" title="cluster health"></span>
      <div class="brand-text">
        <strong>HYPER-CLUSTER</strong>
        <small id="cluster-name">omega</small>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-telemetry" class="icon-btn" aria-label="telemetry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 4 5-7 4 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" aria-label="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ── the telemetry strip ─────────────────────────────────────── -->
  <section id="telemetry" class="telemetry" aria-label="live telemetry">
    <div class="metric"><span class="metric-value" id="m-workers">0</span><span class="metric-label">workers</span></div>
    <div class="metric"><span class="metric-value" id="m-vram">0</span><span class="metric-label">GB vram</span></div>
    <div class="metric"><span class="metric-value" id="m-tps">0</span><span class="metric-label">tok/s</span></div>
    <div class="metric"><span class="metric-value" id="m-model">—</span><span class="metric-label">model</span></div>
    <div class="metric"><span class="metric-value" id="m-queue">0</span><span class="metric-label">queued</span></div>
  </section>

  <!-- ── the conversation ─────────────────────────────────────────── -->
  <main id="chat" class="chat" aria-live="polite">
    <div class="empty" id="empty-state">
      <div class="empty-mark">⚡</div>
      <h1>Mission Control</h1>
      <p>The cluster is listening. Ask anything — it will answer from the mesh,<br/>remember what you told it, and keep learning while you sleep.</p>
      <div class="suggestions" id="suggestions">
        <button class="chip" data-prompt="What is the state of the cluster?">cluster status</button>
        <button class="chip" data-prompt="Summarise what you remember about me.">what do you remember</button>
        <button class="chip" data-prompt="Explain the deployment plan for the head node.">deployment plan</button>
      </div>
    </div>
  </main>

  <!-- ── the composer ─────────────────────────────────────────────── -->
  <footer class="composer">
    <div class="switches">
      <button id="sw-council" class="switch" aria-pressed="false">
        <span class="switch-dot"></span><span class="switch-label">Council</span>
      </button>
      <button id="sw-autopilot" class="switch" aria-pressed="false">
        <span class="switch-dot"></span><span class="switch-label">Autopilot</span>
      </button>
      <button id="sw-voice" class="switch" aria-pressed="false">
        <span class="switch-dot"></span><span class="switch-label">Voice</span>
      </button>
      <button id="sw-rag" class="switch" aria-pressed="false">
        <span class="switch-dot"></span><span class="switch-label">RAG</span>
      </button>
    </div>
    <div id="dropzone" class="dropzone">
      <input id="file-input" type="file" accept=".pdf,.txt,.md,.markdown,.json,.csv,.py,.yaml,.yml" multiple />
      <div class="dropzone-inner">Drop a PDF to teach the cluster</div>
    </div>
    <div class="composer-row">
      <button id="btn-attach" class="icon-btn round" aria-label="attach a document">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Ask the cluster…" enterkeyhint="send" autocomplete="off"></textarea>
      <button id="btn-mic" class="icon-btn round" aria-label="speak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button id="btn-send" class="icon-btn round primary" aria-label="send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/></svg>
      </button>
    </div>
    <div id="status-line" class="status-line"></div>
  </footer>

  <!-- ── the settings sheet ───────────────────────────────────────── -->
  <div id="settings" class="sheet hidden" role="dialog" aria-label="settings">
    <div class="sheet-inner">
      <h2>Mission Control</h2>
      <label class="field">
        <span>Head node</span>
        <input id="set-head" type="url" placeholder="http://127.0.0.1:8080" />
      </label>
      <label class="field">
        <span>API key</span>
        <input id="set-key" type="password" placeholder="(only if the cluster uses one)" />
      </label>
      <label class="field">
        <span>Voice</span>
        <select id="set-voice">
          <option value="">(browser default)</option>
        </select>
      </label>
      <div class="sheet-actions">
        <button id="btn-logout" class="btn ghost">clear</button>
        <button id="btn-save" class="btn primary">save</button>
      </div>
      <p class="hint" id="settings-hint"></p>
    </div>
  </div>

</div>
<script src="/app.js"></script>
</body>
</html>
